judge:
  provider: groq
  model: phi-3

tests:
  - name: refund policy
    endpoint: https://localhost:8000/chat
    method: DELETE
    body:
      message: "What is your return policy?"
    assert:
      - mentions a 30-day return window
      - does not mention a phone number
      - tone is polite

  - name: summarizer
    endpoint: https://your-api.com/summarize
    method: POST
    body:
      text: "The quarterly earnings exceeded expectations by 12%. This is a significant rise from expectations of 10.5%."
    assert:
      - contains the key financial result
      - does not add facts not present in the input
      - is one sentence or less