[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assertllm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.25",
    "openai>=1.0",
    "groq>=0.9",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
assertllm = "assertllm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/assertllm"]